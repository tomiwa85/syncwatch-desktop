name: syncwatch_desktop
description: SyncWatch desktop (Flutter) — sync prototype.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # libmpv-backed playback: MKV/HEVC/AC3/DTS natively, rendered into a Flutter
  # texture so our own overlay UI works on top.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10

  # Native file picker (returns a real path + size — no in-memory copy).
  file_picker: ^8.1.2

  # Backend comms — must speak the SAME protocol as the mobile app, so a phone
  # user and a desktop user can share a room.
  http: ^1.2.2
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
